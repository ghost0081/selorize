name: selorize
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: '>=3.10.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_maps_flutter: ^2.5.3
  permission_handler: ^11.3.1
  intl: ^0.20.2
  url_launcher: ^6.3.2
  http: ^1.6.0
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  lottie: ^3.3.3
  image_picker: ^1.2.1
  geolocator: ^12.0.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  flutter_launcher_icons: ^0.14.4
  geocoding: ^4.0.0
  firebase_core: ^4.8.0
  firebase_auth: ^6.5.0
  google_sign_in: ^7.2.0
  skeletonizer: ^2.1.3
  firebase_messaging: ^16.2.2
  flutter_local_notifications: ^21.0.0
  change_app_package_name: ^1.5.0
  webview_flutter: ^4.14.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/man_1.png
    - assets/google.png
    - assets/home_phone.png
    - assets/pickup.png
    - assets/best_price.png
    - assets/payment.png
    - assets/sell_phone.png
    - assets/iphone_normal.png
    - assets/animation-sell.json
    - assets/confirm_order.json
    - assets/effects.json
    - assets/selorize_home.png
    - assets/selorize_text.png
    - assets/start_animation.png
    - assets/notification_empty.png
    - assets/notification_active.png

flutter_icons:
  android: true
  ios: true
  image_path: "assets/selorize_home.png"

dependency_overrides:
  firebase_core_platform_interface:
    git:
      url: https://github.com/firebase/flutterfire.git
      path: packages/firebase_core/firebase_core_platform_interface
